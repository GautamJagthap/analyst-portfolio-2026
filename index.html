<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading...</title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="shortcut icon" href="p.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- NAV -->
  <nav id="nav">
    <a href="#hero" class="nav-logo" id="navLogo"></a>
    <ul class="nav-links">
      <li><a href="#hero">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <a href="#contact" class="nav-cta">Hire Me</a>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <div class="hero-bg-grid"></div>
    <div class="hero-glow"></div>
    <div class="hero-glow2"></div>
    <div class="hero-tag" id="heroTag"></div>
    <h1 class="hero-name" id="heroName"></h1>
    <p class="hero-role" id="heroRole"></p>
    <div class="hero-bottom">
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-actions">
        <a href="#projects" class="btn-primary">View Work →</a>
        <a href="#about" class="btn-secondary">About Me</a>
      </div>
    </div>
    <div class="hero-scroll">
      <div class="scroll-line"></div>
      Scroll
    </div>
  </section>

  <!-- MARQUEE -->
  <div class="marquee-wrap">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>

  <!-- ABOUT -->
  <section id="about">
    <div class="section-inner">
      <div class="section-label">01 — About</div>
      <div class="about-tabs">
        <button class="about-tab active" data-tab="intro">Intro</button>
        <button class="about-tab" data-tab="experience">Experience</button>
        <button class="about-tab" data-tab="skills">Skills</button>
        <button class="about-tab" data-tab="resume">Resume</button>
      </div>

      <!-- INTRO TAB -->
      <div class="tab-panel active" id="tab-intro">
        <div class="intro-grid">
          <div class="intro-left reveal">
            <p class="intro-big" id="introBig"></p>
            <div id="introBio"></div>
            <div class="intro-stats" id="introStats"></div>
          </div>
          <div class="intro-right reveal reveal-delay-2">
            <div class="status-card" id="statusCard"></div>
            <ul class="interests-list" id="interestsList"></ul>
          </div>
        </div>
      </div>

      <!-- EXPERIENCE TAB -->
      <div class="tab-panel" id="tab-experience">
        <div class="exp-timeline reveal" id="expTimeline"></div>
        <div class="edu-card reveal" id="eduCard"></div>
      </div>

      <!-- SKILLS TAB -->
      <div class="tab-panel" id="tab-skills">
        <div class="skills-grid" id="skillsGrid"></div>
      </div>

      <!-- RESUME TAB -->
      <div class="tab-panel" id="tab-resume">
        <div class="resume-preview reveal" id="resumePreview"></div>
      </div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects">
    <div class="section-inner">
      <div class="projects-header">
        <div>
          <div class="section-label">02 — Projects</div>
          <h2 class="section-title reveal">Selected Work</h2>
        </div>
        <!-- <a href="#" class="btn-secondary reveal">All Projects →</a> -->
      </div>
      <div class="projects-grid" id="projectsGrid"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <div class="section-inner">
      <div class="section-label">03 — Contact</div>
      <div class="contact-grid">
        <div class="contact-left reveal">
          <p class="contact-big" id="contactHeading"></p>
          <p class="contact-desc" id="contactDesc"></p>
          <div class="contact-links" id="contactLinks"></div>
        </div>
        <div class="contact-right reveal reveal-delay-2">
          <form class="contact-form" id="contactForm">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Name</label>
                <input id="name" class="form-input" type="text" placeholder="Your name" />
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input id="email" class="form-input" type="email" placeholder="gjagthap90@gmail.com" />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Subject</label>
              <input id="subject" class="form-input" type="text" placeholder="What's this about?" />
            </div>
            <div class="form-group">
              <label class="form-label">Message</label>
              <textarea id="message" class="form-textarea" rows="5" placeholder="Tell me about your project, opportunity, or just say hi..."></textarea>
            </div>
            <button type="submit" class="form-submit">Send Message →</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <span class="footer-copy" id="footerCopy"></span>
    <div class="footer-links" id="footerLinks"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
